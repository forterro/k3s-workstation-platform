# KubeBlocks PostgreSQL Cluster backing Keycloak. KubeBlocks generates the account Secret
# "<clusterName>-postgresql-account-postgres" and the primary service
# "<clusterName>-postgresql-postgresql", which keycloakx.database consumes.
apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.clusterName }}
  annotations:
    # Before keycloak-db-init (wave -1): the Job waits for the account Secret this Cluster generates.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  terminationPolicy: {{ .Values.postgres.terminationPolicy }}
  clusterDef: postgresql
  topology: replication
  componentSpecs:
    - name: postgresql
      serviceVersion: {{ .Values.postgres.serviceVersion | quote }}
      disableExporter: true
      replicas: 1
      resources:
        {{- toYaml .Values.postgres.resources | nindent 8 }}
      volumeClaimTemplates:
        - name: data
          spec:
            {{- with .Values.postgres.storageClassName }}
            storageClassName: {{ . | quote }}
            {{- end }}
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: {{ .Values.postgres.storage }}
---
# Creates the dedicated `keycloak` database (KubeBlocks only provisions `postgres`). Idempotent; the
# pod waits for the account Secret and the server.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h "$PGHOST" -p 5432 -U "$PGUSER" >/dev/null 2>&1; do sleep 2; done
              if psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$TARGET_DB'" | grep -q 1; then
                echo "database $TARGET_DB exists"
              else
                psql -c "CREATE DATABASE \"$TARGET_DB\""
              fi
          env:
            - name: PGHOST
              value: {{ .Values.keycloakx.database.hostname | quote }}
            - name: PGDATABASE
              value: postgres
            - name: TARGET_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: {{ .Values.keycloakx.database.existingSecret }}, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.keycloakx.database.existingSecret }}, key: password}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
