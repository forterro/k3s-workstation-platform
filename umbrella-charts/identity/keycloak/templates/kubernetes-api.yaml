# The Kubernetes API accepts the realm's tokens (users and groups prefixed `oidc:`): the admin
# group is cluster-admin, and `kubectl` signs in with kubelogin through a public PKCE client.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sso-{{ .Values.adminGroup }}-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ .Values.kubernetesApi.claimPrefix }}{{ .Values.adminGroup }}
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: {{ .Values.kubernetesApi.kubectlClientId }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  realmRef:
    kind: ClusterKeycloakRealm
    name: {{ .Values.realm }}
  clientId: {{ .Values.kubernetesApi.kubectlClientId }}
  name: kubectl
  public: true
  standardFlowEnabled: true
  directAccess: false
  redirectUris:
    - http://localhost:8000
    - http://localhost:18000
  attributes:
    pkce.code.challenge.method: S256
  defaultClientScopes: [web-origins, acr, basic, profile, email, roles, groups]
