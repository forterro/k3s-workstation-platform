{{- $secrets := list "keycloak-admin" }}
{{- range .Values.users }}
{{- $secrets = append $secrets (printf "keycloak-user-%s" .username) }}
{{- end }}
# Generated Secrets (Keycloak bootstrap admin, users' initial passwords): created once by this
# PreSync Job, never rotated, never committed. Read one with
#   kubectl -n {{ .Release.Namespace }} get secret <name> -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-secrets
subjects:
  - kind: ServiceAccount
    name: keycloak-secrets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: keycloak-secrets
      restartPolicy: OnFailure
      containers:
        - name: ensure
          image: {{ .Values.secretsJob.image }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for name in {{ join " " $secrets }}; do
                if kubectl get secret "$name" >/dev/null 2>&1; then
                  echo "$name exists"
                else
                  pw=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32)
                  kubectl create secret generic "$name" --from-literal=password="$pw" >/dev/null
                  echo "$name created"
                fi
              done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
