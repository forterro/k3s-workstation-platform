apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
spec:
  secretName: keycloak-tls
  dnsNames:
    - {{ .Values.host }}
  issuerRef:
    name: {{ .Values.issuer }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
spec:
  entryPoints:
    - {{ .Values.entryPoint }}
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - name: keycloak-http
          port: 80
  tls:
    secretName: keycloak-tls
