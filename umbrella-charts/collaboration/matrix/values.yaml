# Opt-in workstation chat (`matrix.enabled: true` in the config repo values/platform.yaml; needs
# `sso.enabled`). Humans sign in with their workstation Keycloak account; bots (e.g. the agent
# harness) are appservices: each consumer listed in `appservices` writes its registration into the
# Secret matrix-appservice-<name> of this namespace and may restart the homeserver to load it.

# Matrix server name: the suffix of every user and room ID. It can never change once the database
# exists.
serverName: matrix.workstation.internal
# Public URL of the homeserver (clients, SSO callback).
publicUrl: https://matrix.workstation.internal
entryPoint: websecure
issuer: step-ca-acme

homeserver:
  image:
    repository: ghcr.io/matrix-construct/tuwunel
    tag: v1.9.4
    pullPolicy: IfNotPresent
  storage:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}
  # Extra settings merged into `[global]` of tuwunel.toml (values written as given).
  extraConfig: {}

# Sign-in through the workstation Keycloak (KeycloakClient `matrix`, secret generated by the operator).
sso:
  realm: workstation
  issuerUrl: https://sso.workstation.internal/realms/workstation
  clientId: matrix
  name: Workstation SSO
  # Claims tried in order for the Matrix localpart (email: the part before @).
  userIdClaims: [preferred_username, email]

web:
  # Public URL of Element Web.
  publicUrl: https://element.workstation.internal
  brand: Workstation chat
  image:
    repository: vectorim/element-web
    tag: v1.12.32
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# Bots allowed to register as appservices. Each entry lets the ServiceAccount `serviceAccount` of
# namespace `namespace` write the Secret matrix-appservice-<name> (one YAML registration per key)
# and restart the homeserver. Example:
#   appservices:
#     - name: agent-harness
#       namespace: agent-harness
#       serviceAccount: agent-harness
appservices: []
