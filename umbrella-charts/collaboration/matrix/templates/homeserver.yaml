{{- $toml := include "matrix.tuwunelConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix
data:
  tuwunel.toml: |
    {{- $toml | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: matrix
spec:
  selector:
    app.kubernetes.io/name: matrix
  ports:
    - name: http
      port: 8008
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix
spec:
  serviceName: matrix
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix
      annotations:
        checksum/config: {{ $toml | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tuwunel
          image: "{{ .Values.homeserver.image.repository }}:{{ .Values.homeserver.image.tag }}"
          imagePullPolicy: {{ .Values.homeserver.image.pullPolicy }}
          env:
            - name: TUWUNEL_CONFIG
              value: /etc/tuwunel/tuwunel.toml
            # The SSO certificate is signed by the workstation CA (trust-manager bundle).
            - name: SSL_CERT_FILE
              value: /etc/workstation-ca/ca-certificates.crt
          ports:
            - name: http
              containerPort: 8008
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.homeserver.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/tuwunel/tuwunel.toml
              subPath: tuwunel.toml
              readOnly: true
            - name: oidc
              mountPath: /etc/tuwunel/oidc
              readOnly: true
            - name: appservices
              mountPath: /etc/tuwunel/appservices
              readOnly: true
            - name: workstation-ca
              mountPath: /etc/workstation-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: matrix
        - name: oidc
          secret:
            # Generated by the keycloak operator for the KeycloakClient below.
            secretName: keycloak-client-{{ .Values.sso.clientId }}-secret
            items:
              - key: clientSecret
                path: client_secret
        - name: appservices
          {{- if .Values.appservices }}
          projected:
            sources:
              {{- range .Values.appservices }}
              # Written by the consumer; its keys (one registration each) must not clash.
              - secret:
                  name: matrix-appservice-{{ .name }}
                  optional: true
              {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: workstation-ca
          configMap:
            name: workstation-ca
  volumeClaimTemplates:
    # Written in full (apiVersion, kind, volumeMode, status) so Argo CD sees no drift.
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        {{- with .Values.homeserver.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.homeserver.storage.size }}
      status:
        phase: Pending
