{{- $config := dict
  "default_server_config" (dict "m.homeserver" (dict "base_url" .Values.publicUrl "server_name" .Values.serverName))
  "disable_custom_urls" true
  "disable_guests" true
  "brand" .Values.web.brand
  "room_directory" (dict "servers" (list .Values.serverName))
  "setting_defaults" (dict "UIFeature.registration" false "UIFeature.passwordReset" false "UIFeature.deactivate" false)
  "sso_redirect_options" (dict "immediate" true)
  | toPrettyJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: element
data:
  config.json: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: element
spec:
  selector:
    app.kubernetes.io/name: element
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: element
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            # The image listens on 80 by default, which needs a capability.
            - name: ELEMENT_WEB_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            # nginx renders its config and writes its cache/pid at start.
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: config
          configMap:
            name: element
        - {name: tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
        - {name: nginx-conf, emptyDir: {}}
