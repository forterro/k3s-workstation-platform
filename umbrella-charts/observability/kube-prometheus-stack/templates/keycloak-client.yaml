{{- /* Only once the keycloak app has installed the CRD: self-heal adds it then (no failed sync). */}}
{{- if and .Values.sso.enabled (.Capabilities.APIVersions.Has "v1.edp.epam.com/v1") }}
# Confidential client: the operator generates its secret (keycloak-client-<name>-secret, key
# clientSecret) in this namespace, read by Grafana.
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: {{ .Values.sso.clientId }}
spec:
  realmRef:
    kind: ClusterKeycloakRealm
    name: {{ .Values.sso.realm }}
  clientId: {{ .Values.sso.clientId }}
  name: Grafana
  public: false
  standardFlowEnabled: true
  directAccess: false
  webUrl: {{ .Values.sso.url }}
  redirectUris:
    - {{ .Values.sso.url }}/login/generic_oauth
  webOrigins:
    - {{ .Values.sso.url }}
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: {{ .Values.sso.url }}/*
  defaultClientScopes: [web-origins, acr, basic, profile, email, roles, groups]
{{- end }}
