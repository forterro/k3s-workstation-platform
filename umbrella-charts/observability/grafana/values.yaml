# Values passed to the upstream Grafana subchart. Umbrella-level addons (the
# IngressRoute and Certificate) live in templates/.
grafana:
  service:
    type: ClusterIP

  # Admin credentials come from a stable, out-of-git secret so ArgoCD does not
  # regenerate a random password on every reconcile. Create it once with:
  #   kubectl -n observability create secret generic grafana-admin \
  #     --from-literal=admin-user=admin --from-literal=admin-password=<password>
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    size: 2Gi

  # local-path (WSL2) rejects the root chown init container; fsGroup already
  # fixes volume ownership for the grafana user.
  initChownData:
    enabled: false

  # Prometheus (the workstation metrics store) provisioned as the default datasource.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server.observability.svc.cluster.local
          isDefault: true

# Expose Grafana through Traefik over TLS, with a certificate issued by step-ca via cert-manager.
ingressRoute:
  enabled: true
  host: grafana.workstation.internal
  entryPoint: websecure
  issuer: step-ca-acme
  service:
    name: grafana
    port: 80
