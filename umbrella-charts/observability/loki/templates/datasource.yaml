{{- if .Values.datasource.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: {{ .Values.datasource.url }}
        jsonData:
          maxLines: 5000
{{- end }}
