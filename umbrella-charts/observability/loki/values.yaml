# Log store of the workstation: one Loki process on the local disk. Logs are shipped by Alloy
# (umbrella-charts/observability/alloy) and read in Grafana through the datasource of this chart.
loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 720h          # 30 days
      allow_structured_metadata: true
      volume_enabled: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    pattern_ingester:
      enabled: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Single binary only: no scalable targets, no caches, no gateway, no canary.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

# Grafana datasource, picked up by the Grafana sidecar (label grafana_datasource=1).
datasource:
  enabled: true
  url: http://loki.observability.svc.cluster.local:3100
