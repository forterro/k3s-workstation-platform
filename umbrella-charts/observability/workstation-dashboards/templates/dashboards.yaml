{{- /* One ConfigMap per dashboard (1 MiB API limit), generated JSON in dashboards/. */}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workstation-dashboard-{{ base $path | trimSuffix ".json" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: workstation-dashboards
    {{ $.Values.label }}: {{ $.Values.labelValue | quote }}
  annotations:
    grafana_folder: {{ $.Values.folder | quote }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
