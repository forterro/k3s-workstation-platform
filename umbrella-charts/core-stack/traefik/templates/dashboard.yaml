{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dashboard
  labels:
    # Picked up automatically by the Grafana dashboard sidecar (searchNamespace: ALL).
    grafana_dashboard: "1"
data:
  traefik.json: |-
{{ .Files.Get "dashboards/traefik.json" | indent 4 }}
{{- end }}
