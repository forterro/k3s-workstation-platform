{{- if .Values.dashboardRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ .Values.dashboardRoute.entryPoint }}
  routes:
    - match: {{ .Values.dashboardRoute.match | quote }}
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
{{- end }}
