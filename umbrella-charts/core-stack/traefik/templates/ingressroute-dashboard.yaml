{{- with .Values.dashboardRoute }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: traefik-dashboard-tls
  dnsNames:
    - {{ .host }}
  issuerRef:
    name: {{ .issuer }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - {{ .entryPoint }}
  routes:
    - match: Host(`{{ .host }}`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: traefik-dashboard-tls
{{- end }}
{{- end }}
