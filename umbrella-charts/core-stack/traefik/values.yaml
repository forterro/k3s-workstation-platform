# Umbrella-level addons live in templates/. The dashboard route below exposes the Traefik
# dashboard/api through Traefik over TLS, with a certificate issued by step-ca via cert-manager.
dashboardRoute:
  enabled: true
  host: traefik.workstation.internal
  entryPoint: websecure
  issuer: step-ca-acme

# Ship the Traefik Grafana dashboard as a ConfigMap auto-discovered by the Grafana sidecar.
dashboards:
  enabled: true

# Values passed to the upstream Traefik subchart. Exposed through MetalLB (L2 mode): the service is
# annotated with the MetalLB pool name so it always gets the fixed workstation address handed out by
# the single-address pool the seed applies (config.yaml loadbalancer_ip). The chart already exposes
# the web (80) and websecure (443, TLS) entry points by default.
traefik:
  service:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: workstation-pool
  # Global HTTP-to-HTTPS redirect: every request on the web (80) entry point is
  # 308-redirected to websecure (443). Bricks only declare a websecure IngressRoute,
  # so without this a plain http:// request (what browsers try first) returns 404.
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
  ingressRoute:
    dashboard:
      enabled: false
  # Expose Prometheus metrics (enabled by default on the internal "metrics" entrypoint) and let the
  # Prometheus Operator scrape them via a ServiceMonitor. Entry-point and service labels feed the
  # standard Traefik Grafana dashboard.
  metrics:
    prometheus:
      addEntryPointsLabels: true
      addServicesLabels: true
      # Dedicated metrics service selected by the ServiceMonitor (targetPort: metrics).
      service:
        enabled: true
      serviceMonitor:
        enabled: true
