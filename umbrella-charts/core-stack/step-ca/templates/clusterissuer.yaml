{{- with .Values.acmeIssuer }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    server: {{ .server | quote }}
    caBundle: {{ $.Files.Get "files/root_ca.crt" | b64enc }}
    privateKeySecretRef:
      name: {{ .name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .ingressClassName }}
{{- end }}
{{- end }}
