# The CA key material is provided out-of-band and kept local to the workstation (never committed):
# the bootstrap generates it under ~/.k3s-workstation-platform/ca and applies the ConfigMaps
# (step-ca-certs, step-ca-config), Secrets (step-ca-secrets, step-ca-ca-password) and the
# cert-manager ClusterIssuer imperatively. existingSecrets mode makes this chart consume those
# pre-existing resources instead of generating a CA in-cluster.
step-certificates:
  fullnameOverride: step-ca
  bootstrap:
    enabled: false
    configmaps: false
    secrets: false
  inject:
    enabled: false
  existingSecrets:
    enabled: true
    ca: true
    certsAsSecret: false
    configAsSecret: false
  service:
    type: ClusterIP
    port: 443
    targetPort: 9000
  ca:
    db:
      enabled: true
      persistent: true
      size: 1Gi
