# Values passed to the upstream Headlamp subchart. Umbrella-level addons (e.g. an IngressRoute)
# would go in templates/.
headlamp:
  service:
    type: ClusterIP

# Expose Headlamp through Traefik over TLS, with a certificate issued by step-ca via cert-manager.
ingressRoute:
  enabled: true
  host: headlamp.workstation.internal
  entryPoint: websecure
  issuer: step-ca-acme
  service:
    name: headlamp
    port: 80

# Sign-in through the workstation Keycloak, switched on by the platform chart with values-sso.yaml.
# Headlamp passes the user's token to the Kubernetes API, which trusts the realm when the bootstrap
# `api-oidc` phase has configured it. Renders the KeycloakClient of Headlamp.
sso:
  enabled: false
  realm: workstation
  clientId: headlamp
  url: https://headlamp.workstation.internal
