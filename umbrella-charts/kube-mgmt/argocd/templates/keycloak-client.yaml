{{- if .Values.sso.enabled }}
# Public client with PKCE: Argo CD needs no client secret. Callbacks: UI (/pkce/verify) and
# `argocd login --sso` (localhost:8085).
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: {{ .Values.sso.clientId }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  realmRef:
    kind: ClusterKeycloakRealm
    name: {{ .Values.sso.realm }}
  clientId: {{ .Values.sso.clientId }}
  name: Argo CD
  public: true
  standardFlowEnabled: true
  directAccess: false
  webUrl: {{ .Values.sso.url }}
  redirectUris:
    - {{ .Values.sso.url }}/pkce/verify
    - {{ .Values.sso.url }}/auth/callback
    - http://localhost:8085/auth/callback
  webOrigins:
    - {{ .Values.sso.url }}
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: {{ .Values.sso.url }}/*
  defaultClientScopes: [web-origins, acr, basic, profile, email, roles, groups]
{{- end }}
