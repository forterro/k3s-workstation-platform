apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeblocks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # KubeBlocks CRDs carry many schema defaults (and admission webhooks) that the
    # API server injects on apply (timeoutSeconds, podManagementPolicy, protocol,
    # updateStrategy, ...). ServerSideDiff computes the predicted merge server-side
    # so those defaulted fields no longer show as permanent OutOfSync drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: workstation
  source:
    repoURL: https://github.com/forterro/k3s-workstation-platform.git
    targetRevision: main
    path: umbrella-charts/kubeblocks-system/kubeblocks
  destination:
    server: https://kubernetes.default.svc
    namespace: kb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # KubeBlocks ships large CRDs: ServerSideApply avoids the client-side
    # last-applied annotation size limit, and the retry/backoff absorbs the
    # CRD-then-CR ordering races during the initial install.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
