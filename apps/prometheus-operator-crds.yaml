apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    # Install the monitoring CRDs before workloads that render ServiceMonitors (e.g. Traefik).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: workstation
  source:
    repoURL: https://github.com/forterro/k3s-workstation-platform.git
    targetRevision: main
    path: umbrella-charts/observability/prometheus-operator-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
