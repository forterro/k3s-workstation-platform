apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: workstation
  source:
    repoURL: https://github.com/forterro/k3s-workstation-platform.git
    targetRevision: main
    path: umbrella-charts/core-stack/step-ca
  destination:
    server: https://kubernetes.default.svc
    namespace: step-ca
  # The API server defaults apiVersion/kind onto each StatefulSet volumeClaimTemplate, which the
  # Helm manifest omits; ignore only those fields to avoid a perpetual OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: step-ca
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
