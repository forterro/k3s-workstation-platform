# KSOPS generator: the KSOPS plugin on the ArgoCD repo-server decrypts these SOPS-encrypted
# manifests at render time using the age key from the sops-age secret. The *.enc.yaml files are
# produced by scripts/generate-ca.sh (run `make generate-ca`) and committed encrypted.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: step-ca-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./step-ca-secrets.enc.yaml
  - ./step-ca-ca-password.enc.yaml
