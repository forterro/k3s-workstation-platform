# Cilium values for a single-node k3s workstation. k3s runs with flannel, servicelb, traefik, its
# network policy controller, and kube-proxy all disabled, so Cilium owns the full datapath.
# kube-proxy replacement plus eBPF masquerade avoid iptables, which is unreliable on WSL2.
cilium:
  kubeProxyReplacement: true
  # Single-node k3s: the API server is reachable locally.
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 6443
  bpf:
    masquerade: true
  operator:
    # Single node: one operator replica.
    replicas: 1
  ipam:
    # Use the pod CIDR that the k3s controller-manager assigns to the node.
    mode: kubernetes
  rollOutCiliumPods: true
