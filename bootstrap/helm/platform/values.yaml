# Base platform definition: one ArgoCD Application per entry of `apps`. User-agnostic; the only
# per-workstation inputs are the config repo (set by the root app) and its `values/platform.yaml`.
project: workstation

# This repository (self reference).
repoURL: https://github.com/forterro/k3s-workstation-platform.git
targetRevision: main

# The workstation's private config repo. When set, every app also reads the optional overlay
# `values/<name>.yaml` from it (a missing file is ignored).
configRepoURL: ""
configRepoRevision: main

# Sync options of every app unless the app sets its own `syncOptions`.
syncOptions: [CreateNamespace=true, ServerSideApply=true]

apps:
  - name: prometheus-operator-crds
    namespace: observability
    path: umbrella-charts/observability/prometheus-operator-crds
    # Install the monitoring CRDs before workloads that render ServiceMonitors (e.g. Traefik).
    wave: "-1"
  - name: cert-manager
    namespace: cert-manager
    path: umbrella-charts/core-stack/cert-manager
    wave: "-1"
  - name: metallb
    namespace: metallb-system
    path: umbrella-charts/core-stack/metallb
    wave: "-1"
  - name: kubeblocks
    namespace: kb-system
    path: umbrella-charts/kubeblocks-system/kubeblocks
    wave: "-1"
    # KubeBlocks CRDs carry many schema defaults (and admission webhooks) that the API server
    # injects on apply; ServerSideDiff predicts the merge so they do not show as drift.
    compareOptions: ServerSideDiff=true
    # Large CRDs: the retry absorbs the CRD-then-CR ordering races of the first install.
    retry: {limit: 10, backoff: {duration: 30s, factor: 2, maxDuration: 10m}}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    # The operator enriches ComponentDefinition specs after apply; CDs are versioned and
    # immutable, so ignoring these operator-owned fields is safe.
    ignoreDifferences:
      - group: apps.kubeblocks.io
        kind: ComponentDefinition
        jsonPointers:
          - /spec/lifecycleActions
          - /spec/runtime
          - /spec/services
          - /spec/minReadySeconds
          - /spec/podManagementPolicy
          - /spec/podUpdatePolicy
          - /spec/updateStrategy
  - name: workstation-dns
    namespace: kube-system
    path: umbrella-charts/core-stack/workstation-dns
    syncOptions: [ServerSideApply=true]
    wave: "0"
  - name: traefik
    namespace: traefik
    path: umbrella-charts/core-stack/traefik
  - name: argocd
    namespace: argocd
    path: umbrella-charts/kube-mgmt/argocd
    syncOptions: [ServerSideApply=true]
  - name: headlamp
    namespace: headlamp
    path: umbrella-charts/kube-mgmt/headlamp
  - name: kube-prometheus-stack
    namespace: observability
    path: umbrella-charts/observability/kube-prometheus-stack
    # The stack's large CRDs can take longer to become Established than a single sync allows.
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
  - name: loki
    namespace: observability
    path: umbrella-charts/observability/loki
  - name: alloy
    namespace: observability
    path: umbrella-charts/observability/alloy
  - name: step-ca
    namespace: step-ca
    path: umbrella-charts/core-stack/step-ca
    wave: "1"
    # The API server defaults apiVersion/kind onto each volumeClaimTemplate, which the Helm
    # manifest omits.
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        name: step-ca
        jqPathExpressions:
          - .spec.volumeClaimTemplates[]?.apiVersion
          - .spec.volumeClaimTemplates[]?.kind
  - name: workstation-dashboards
    namespace: observability
    path: umbrella-charts/observability/workstation-dashboards
    syncOptions: [ServerSideApply=true]
    wave: "2"
