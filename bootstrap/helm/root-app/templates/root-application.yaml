{{- with .Values.rootApp }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 0-root-k3s-workstation
  namespace: {{ $.Release.Namespace }}
  finalizers:
    # Path-qualified variant (has a `/`) so Kubernetes does not warn about the finalizer name;
    # ArgoCD still cascade-deletes managed resources (background propagation).
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: workstation
  {{- if $.Values.configRepoURL }}
  sources:
    - repoURL: {{ .repoURL | quote }}
      targetRevision: {{ .targetRevision | quote }}
      path: {{ .path | quote }}
      helm:
        valueFiles:
          - $values/values/platform.yaml
        ignoreMissingValueFiles: true
        valuesObject:
          repoURL: {{ .repoURL | quote }}
          targetRevision: {{ .targetRevision | quote }}
          configRepoURL: {{ $.Values.configRepoURL | quote }}
          configRepoRevision: {{ $.Values.configRepoRevision | quote }}
    - repoURL: {{ $.Values.configRepoURL | quote }}
      targetRevision: {{ $.Values.configRepoRevision | quote }}
      ref: values
  {{- else }}
  source:
    repoURL: {{ .repoURL | quote }}
    targetRevision: {{ .targetRevision | quote }}
    path: {{ .path | quote }}
    helm:
      valuesObject:
        repoURL: {{ .repoURL | quote }}
        targetRevision: {{ .targetRevision | quote }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
