# Root app-of-apps: ArgoCD renders the platform chart (`path`) from this git repository, which
# creates one child Application per base component. Point repoURL/targetRevision at the
# repository (and revision) you push to.
rootApp:
  repoURL: https://github.com/forterro/k3s-workstation-platform.git
  targetRevision: main
  path: bootstrap/helm/platform

# The workstation's private config repo (set by the bootstrap). When set, the platform chart also
# reads `values/platform.yaml` from it and gives every child app its optional overlay
# `values/<name>.yaml`.
configRepoURL: ""
configRepoRevision: main
