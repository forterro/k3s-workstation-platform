# ArgoCD values for a single-node local workstation. Minimal footprint: dex (SSO) and the
# notifications controller are disabled. The server runs in insecure mode behind a local ingress.
argo-cd:
  configs:
    params:
      server.insecure: true
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    replicas: 1
  server:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1

# Root app-of-apps: ArgoCD reconciles the child Applications found under `path` in this git
# repository. Point repoURL/targetRevision at the repository (and revision) you push to.
rootApp:
  repoURL: https://github.com/forterro/k3s-workstation-platform.git
  targetRevision: main
  path: apps
