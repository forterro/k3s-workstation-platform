# ArgoCD values for a single-node local workstation. TLS termination is handled later by the
# ingress; the server runs in insecure mode behind it for local access.
argo-cd:
  configs:
    params:
      server.insecure: true
  controller:
    replicas: 1
  server:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1

# Root app-of-apps: ArgoCD reconciles the child Applications found under `path` in this git
# repository. Point repoURL/targetRevision at the repository (and revision) you push to.
rootApp:
  repoURL: https://github.com/forterro/k3s-workstation-platform.git
  targetRevision: main
  path: apps
