# ArgoCD values for a single-node local workstation. Minimal footprint: dex (SSO) and the
# notifications controller are disabled. The server runs in insecure mode behind a local ingress.
argo-cd:
  configs:
    params:
      server.insecure: true
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    replicas: 1
  server:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1
