# Project metadata and tooling for the k3s workstation platform bootstrap generator.
# Managed with uv. License is intentionally left unset until chosen (see README open items).

[project]
name = "k3s-workstation-platform"
version = "0.1.0"
description = "Imperative seed bootstrap generator for the k3s AI workstation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Olivier Gintrand" }]
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
k3s-workstation-bootstrap = "workstation_bootstrap.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workstation_bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
