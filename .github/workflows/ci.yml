name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: make lint

      - name: Pytest
        run: make test

  charts:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint charts
        run: |
          set -euo pipefail
          for chart in umbrella-charts/*/* bootstrap/helm/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "==> $chart"
              helm lint "$chart"
            fi
          done

  # A red run on a Renovate PR or a scheduled run is easy to miss: track it in an issue
  # (commented on every new failure, closed by the next green run).
  report:
    name: Report CI failures
    needs: [python, charts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open / close the CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ISSUE_ASSIGNEES: ${{ vars.CI_ISSUE_ASSIGNEES }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          args=()
          if [ -n "${PR_URL:-}" ]; then args=(--context "PR: ${PR_URL}"); fi
          python3 .github/scripts/ci-issue.py "$RESULT" --key "ci-${BRANCH}" \
            --title "CI failure on ${BRANCH}" "${args[@]}"
